<!doctype html>
<html lang="id">
<!-- Infografik Flat, custom page for "Kenapa Allah Tidak Bisa Kelihatan?" (one canvas, zoom-out chain: each world shrinks
     into a gold ring lying in the desert of the next). Placeholder: __TOTAL_S__ -->
<head>
<meta charset="utf-8">
<script src="assets/lib/gsap.min.js"></script>
<script src="assets/props.js"></script>
<style>
@font-face{font-family:"Jakarta";font-weight:800;src:url("assets/fonts/lemo/jakarta-800.woff2")}
@font-face{font-family:"Fredoka";font-weight:700;src:url("assets/fonts/lemo/fredoka-700.woff2")}
@font-face{font-family:"Fredoka";font-weight:500;src:url("assets/fonts/lemo/fredoka-500.woff2")}
@font-face{font-family:"Amiri";font-weight:700;src:url("assets/fonts/amiri-arabic-700-normal.woff2")}
html,body{margin:0;background:#10213f}
#root{position:relative;width:1080px;height:1920px;overflow:hidden;background:#10213f}
canvas{position:absolute;left:0;top:0}
</style>
</head>
<body>
<div id="root" data-composition-id="root" data-start="0" data-duration="__TOTAL_S__" data-width="1080" data-height="1920">
<canvas id="cv" width="1080" height="1920"></canvas>
<audio id="vo" src="assets/audio.mp3" data-start="0" data-duration="__TOTAL_S__" data-track-index="1"></audio>
</div>
<script>
(function () {
const T = __TOTAL_S__, W = 1080, H = 1920, CX = 540, CY = 900;
const cv = document.getElementById('cv'), X = cv.getContext('2d');
const NAVY = '#10213f', YEL = '#ffc93c', WHITE = '#ffffff', CORAL = '#ff6b6b', MINT = '#3ddc97', SKY = '#4fb3ff', SAND = '#f2c46d', SAND2 = '#d9a54a', GOLD = '#ffd34d';
const clamp = (v, a = 0, b = 1) => Math.max(a, Math.min(b, v));
const f = (t, a, b) => clamp((t - a) / (b - a));
const eio = x => x < .5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2;
const back = x => { const c = 1.7; return 1 + (c + 1) * Math.pow(x - 1, 3) + c * Math.pow(x - 1, 2); };
let seed = 7; const rnd = () => (seed = (seed * 16807) % 2147483647) / 2147483647;
const STARS = Array.from({ length: 420 }, () => [rnd() * 2 - 1, rnd() * 2 - 1, rnd()]);

// ---------- worlds: 0 bumi · 1..7 langit · 8 sidratul muntaha · 9 lautan · 10 'arsy (light only)
const LV = [
  { n: 'BUMI', c1: '#4fb3ff', c2: '#2a7fd4' },
  ...[1, 2, 3, 4, 5, 6, 7].map(i => ({ n: 'LANGIT ' + i, c1: ['#2d5fa8', '#3358a0', '#3a4f98', '#41468f', '#4a3f88', '#533880', '#5c3178'][i - 1], c2: '#1a2f5c' })),
  { n: 'SIDRATUL MUNTAHA', c1: '#2f8f6a', c2: '#1c5a43' },
  { n: 'LAUTAN', c1: '#1aa6b7', c2: '#0e6a7a' },
  { n: "'ARSY", c1: '#fff1c2', c2: '#ffd34d' },
];
const ZK = 14; // each world is 14x the previous
// zoom keyframes [time, level]
const ZKEY = [[0, 0], [50.6, 0], [52.0, 1], [87.9, 1], [89.1, 2], [92.6, 2], [93.4, 3], [94.4, 3], [95.2, 4], [96.2, 4], [97.0, 5], [98.0, 5], [98.8, 6], [99.8, 6], [100.8, 7], [104.7, 7], [105.9, 8], [114.3, 8], [115.5, 9], [132.6, 9], [134.0, 10], [141.2, 10], [142.6, 10.9]];
function Z(t) { for (let i = 1; i < ZKEY.length; i++) { const [t0, z0] = ZKEY[i - 1], [t1, z1] = ZKEY[i]; if (t <= t1) return z0 + (z1 - z0) * eio(clamp((t - t0) / (t1 - t0))); } return ZKEY[ZKEY.length - 1][1]; }

function rr(x, y, w, h, r) { X.beginPath(); X.roundRect(x, y, w, h, r); }
function txt(s, x, y, size, col, font = 'Jakarta', w = 800, align = 'center', maxW = 960) {
  X.font = `${w} ${size}px "${font}", sans-serif`; let sz = size;
  while (X.measureText(s).width > maxW && sz > 20) { sz -= 2; X.font = `${w} ${sz}px "${font}", sans-serif`; }
  X.textAlign = align; X.textBaseline = 'middle'; X.fillStyle = col; X.fillText(s, x, y);
}
function pill(s, x, y, size, bg, fg) { X.font = `700 ${size}px "Fredoka", sans-serif`; const w = X.measureText(s).width + size * 1.2, h = size * 1.6;
  rr(x - w / 2, y - h / 2, w, h, h / 2); X.fillStyle = bg; X.fill(); txt(s, x, y + 2, size, fg, 'Fredoka', 700); }
function ring(x, y, r, a = 1) { if (r < .6) return; X.save(); X.globalAlpha *= a; X.lineWidth = Math.max(1.5, r * .28); X.strokeStyle = GOLD;
  X.beginPath(); X.ellipse(x, y, r, r * .42, 0, 0, Math.PI * 2); X.stroke(); X.lineWidth = Math.max(.8, r * .08); X.strokeStyle = '#fff7d6';
  X.beginPath(); X.ellipse(x, y - r * .05, r * .92, r * .36, 0, Math.PI * 1.1, Math.PI * 1.6); X.stroke();
  if (r > 6) { X.fillStyle = '#7fe3ff'; X.beginPath(); X.arc(x, y - r * .42, r * .16, 0, Math.PI * 2); X.fill(); } X.restore(); }
function earth(x, y, r) { const g = X.createRadialGradient(x - r * .3, y - r * .3, r * .1, x, y, r); g.addColorStop(0, '#7fd0ff'); g.addColorStop(1, '#1f6fc2');
  X.fillStyle = g; X.beginPath(); X.arc(x, y, r, 0, Math.PI * 2); X.fill(); X.fillStyle = MINT;
  [[-.3, -.2, .35, .25], [.25, .15, .3, .35], [-.1, .45, .25, .15]].forEach(([a, b, c, d]) => { X.beginPath(); X.ellipse(x + a * r, y + b * r, c * r, d * r, .4, 0, Math.PI * 2); X.fill(); }); }

// one world = a big disc "desert" seen from far: sky disc + dunes + its inner content (previous world) as a ring on the sand
function world(i, x, y, r, t) {
  if (r < 1.2) return;
  const L = LV[i];
  if (i === 0) { earth(x, y, r); return; }
  X.save(); X.beginPath(); X.arc(x, y, r, 0, Math.PI * 2); X.clip();
  if (i === 10) { const g = X.createRadialGradient(x, y - r * .4, r * .05, x, y, r); g.addColorStop(0, '#ffffff'); g.addColorStop(.5, '#fff1c2'); g.addColorStop(1, '#ffcf4a'); X.fillStyle = g; X.fillRect(x - r, y - r, 2 * r, 2 * r); }
  else {
    const g = X.createLinearGradient(x, y - r, x, y + r); g.addColorStop(0, L.c2); g.addColorStop(.55, L.c1); g.addColorStop(1, L.c1); X.fillStyle = g; X.fillRect(x - r, y - r, 2 * r, 2 * r);
    if (i <= 7) { X.fillStyle = '#ffffff'; STARS.forEach(([a, b, s], k) => { if (k % 3 !== i % 3) return; const sx = x + a * r, sy = y - r + (b + 1) * r * .55; X.globalAlpha = .35 + s * .5; X.fillRect(sx, sy, 1 + s * r * .006, 1 + s * r * .006); }); X.globalAlpha = 1; }
    if (i === 9) { X.strokeStyle = 'rgba(255,255,255,.35)'; X.lineWidth = Math.max(1, r * .01); for (let k = 0; k < 7; k++) { X.beginPath(); for (let u = -1; u <= 1.01; u += .05) { const px = x + u * r, py = y - r * .5 + k * r * .14 + Math.sin(u * 9 + k + t * 1.5) * r * .02; u === -1 ? X.moveTo(px, py) : X.lineTo(px, py); } X.stroke(); } }
    // sand / ground of this world
    const gy = y - r * .04;
    X.fillStyle = i === 9 ? '#0e6a7a' : SAND2; X.beginPath(); X.moveTo(x - r, y + r); X.lineTo(x - r, gy + r * .08);
    for (let u = -1; u <= 1.01; u += .1) X.lineTo(x + u * r, gy + Math.sin(u * 5 + i) * r * .05); X.lineTo(x + r, y + r); X.fill();
    X.fillStyle = i === 9 ? '#127f90' : SAND; X.beginPath(); X.moveTo(x - r, y + r); X.lineTo(x - r, gy + r * .2);
    for (let u = -1; u <= 1.01; u += .1) X.lineTo(x + u * r, gy + r * .16 + Math.sin(u * 4 - i) * r * .06); X.lineTo(x + r, y + r); X.fill();
    if (i === 8) { // sidrah tree on the horizon
      const tx = x + r * .45, ty = gy + r * .02, s = r * .22; X.fillStyle = '#6b4a2b'; X.fillRect(tx - s * .06, ty - s * .7, s * .12, s * .72);
      X.fillStyle = '#3ddc97'; [[0, -.95, .5], [-.35, -.75, .35], [.35, -.75, .35], [0, -.6, .4]].forEach(([a, b, c]) => { X.beginPath(); X.arc(tx + a * s, ty + b * s, c * s, 0, Math.PI * 2); X.fill(); }); }
  }
  X.restore();
  // rim
  X.lineWidth = Math.max(2, r * .012); X.strokeStyle = i === 10 ? '#ffe9a0' : 'rgba(255,255,255,.55)'; X.beginPath(); X.arc(x, y, r, 0, Math.PI * 2); X.stroke();
}

// draw the nested chain for zoom level z: world k has radius R0 * ZK^(z-k)
function chain(t, z, alpha = 1) {
  const R0 = 400, top = Math.min(10, Math.floor(z) + 1);
  X.save(); X.globalAlpha = alpha;
  for (let k = top; k >= 0; k--) {
    const r = R0 * Math.pow(ZK, k - z);
    if (r > 2600) continue;
    if (k < top && r < 90) { const m = f(r, 40, 90); if (m > 0) { X.save(); X.globalAlpha *= m; world(k, CX, CY, r, t); X.restore(); } ring(CX, CY, Math.max(r * 1.1, 2.2), 1 - m * .7); break; }
    world(k, CX, CY, r, t);
    if (k === 0) { X.save(); X.globalAlpha *= 1 - f(z, .1, .3); txt('BUMI', CX, CY + r + 60, 48, SKY, 'Fredoka', 700); X.restore(); }
  }
  X.restore();
}

// ---------- captions (words from PROPS, groups of <=3, active word yellow)
const WORDS = (window.PROPS.words || []).map(w => ({ s: w.startMs / 1000, e: w.endMs / 1000, x: w.text }));
const GROUPS = []; { let cur = []; WORDS.forEach((w, i) => { cur.push(w); if (cur.length >= 3 || /[.,!?;:]$/.test(w.x) || i === WORDS.length - 1 || (WORDS[i + 1] && WORDS[i + 1].s - w.e > .6)) { GROUPS.push(cur); cur = []; } }); }
function captions(t) {
  const g = GROUPS.find(g => t >= g[0].s - .05 && t <= g[g.length - 1].e + .25); if (!g) return;
  X.font = '700 64px "Fredoka", sans-serif'; const parts = g.map(w => w.x.replace(/^-/, '')); const sp = 18;
  const ws = parts.map(p => X.measureText(p).width), tot = ws.reduce((a, b) => a + b, 0) + sp * (parts.length - 1);
  let sz = 64; if (tot > 940) sz = 64 * 940 / tot; X.font = `700 ${sz}px "Fredoka", sans-serif`;
  const ws2 = parts.map(p => X.measureText(p).width), tot2 = ws2.reduce((a, b) => a + b, 0) + sp * (parts.length - 1);
  let x = CX - tot2 / 2; const y = 1560;
  rr(CX - tot2 / 2 - 30, y - sz * .85, tot2 + 60, sz * 1.7, 30); X.fillStyle = 'rgba(8,16,34,.72)'; X.fill();
  g.forEach((w, i) => { const on = t >= w.s && t <= w.e + .05; X.textAlign = 'left'; X.textBaseline = 'middle'; X.fillStyle = on ? YEL : WHITE; X.fillText(parts[i], x, y + 3); x += ws2[i] + sp; });
}

// ---------- headline band (top), always big Indonesian text
function head(s, a, col = WHITE, y = 300, size = 78) { if (a <= 0) return; X.save(); X.globalAlpha = a; X.translate(0, (1 - a) * 30); txt(s, CX, y, size, col); X.restore(); }
function chip(s, a, y = 210, bg = YEL) { if (a <= 0) return; X.save(); X.globalAlpha = a; pill(s, CX, y, 34, bg, NAVY); X.restore(); }

// ---------- scenes
function sceneHook(t) { // 0–8.5
  const a = f(t, 0, .6) * (1 - f(t, 8.0, 8.6)); if (a <= 0) return; X.save(); X.globalAlpha = a;
  X.fillStyle = '#ffffff'; STARS.forEach(([sx, sy, s]) => { X.globalAlpha = a * (.3 + .6 * s * (.6 + .4 * Math.sin(t * 2 + s * 20))); X.fillRect(CX + sx * 540, 700 + sy * 380, 2 + s * 3, 2 + s * 3); }); X.globalAlpha = a;
  // ground + faceless person looking up
  X.fillStyle = '#1b3560'; X.beginPath(); X.ellipse(CX, 1380, 700, 160, 0, Math.PI, 0); X.fill();
  const px = CX - 40, py = 1225; X.fillStyle = '#0a1428'; X.beginPath(); X.arc(px + 10, py - 150, 42, 0, Math.PI * 2); X.fill();
  rr(px - 40, py - 105, 90, 190, 40); X.fill(); X.fillRect(px - 30, py + 60, 26, 110); X.fillRect(px + 14, py + 60, 26, 110);
  // gaze line that fades out
  const ga = f(t, 1.5, 3); X.setLineDash([14, 16]); X.strokeStyle = 'rgba(255,201,60,.8)'; X.lineWidth = 5; X.beginPath(); X.moveTo(px + 30, py - 190); X.lineTo(px + 30 + 260 * ga, py - 190 - 520 * ga); X.stroke(); X.setLineDash([]);
  // question mark pops
  const q = back(f(t, 2.6, 3.4)); if (q > 0) { X.save(); X.translate(CX + 240, 700); X.scale(q, q); txt('?', 0, 0, 260, YEL, 'Jakarta'); X.restore(); }
  X.restore();
  chip('PERTANYAAN', f(t, .2, .8) * (1 - f(t, 8, 8.6)));
  head('KENAPA ALLAH', f(t, .4, 1.1) * (1 - f(t, 8, 8.6)), WHITE, 300, 92);
  head('TIDAK TERLIHAT?', f(t, .7, 1.4) * (1 - f(t, 8, 8.6)), YEL, 400, 92);
}
function sceneAkbar(t) { // 8.5–24
  const a = f(t, 8.5, 9.1) * (1 - f(t, 23.6, 24.2)); if (a <= 0) return;
  chip('JAWABANNYA ADA DI SHALAT', a);
  X.save(); X.globalAlpha = a;
  const s1 = back(f(t, 13.6, 14.3)); if (s1 > 0) { X.save(); X.translate(CX, 640); X.scale(s1, s1); txt('اللهُ أَكْبَرُ', 0, 0, 170, YEL, 'Amiri', 700); X.restore(); }
  head('ALLAHU AKBAR', f(t, 14, 14.6), WHITE, 820, 96);
  // frame around AKBAR that breaks out of the screen
  const fb = f(t, 17.4, 18.2), br = eio(f(t, 20.6, 22.2));
  if (fb > 0) { X.globalAlpha = a * fb; const bw = 520 + br * 900, bh = 200 + br * 700;
    X.lineWidth = 10; X.strokeStyle = CORAL; X.setLineDash(br > 0 ? [60, 40 + br * 80] : []); rr(CX - bw / 2, 1100 - bh / 2, bw, bh, 30); X.stroke(); X.setLineDash([]);
    txt('AKBAR', CX, 1100, 130 + br * 30, CORAL);
    X.globalAlpha = a * f(t, 18.2, 18.8); txt('= MAHA BESAR', CX, 1270 + br * 0, 56, WHITE, 'Fredoka', 700);
    X.globalAlpha = a * f(t, 21, 21.8); pill('MELAMPAUI SEGALA BATAS', CX, 1380, 48, YEL, NAVY);
    // arrows pointing outwards
    X.globalAlpha = a * br; X.strokeStyle = YEL; X.lineWidth = 8; [[-1, 0], [1, 0], [0, -1], [0, 1]].forEach(([dx, dy]) => { const x0 = CX + dx * 300, y0 = 1100 + dy * 150; X.beginPath(); X.moveTo(x0, y0); X.lineTo(x0 + dx * 180, y0 + dy * 180); X.stroke(); });
  }
  X.restore();
}
const COUNT = [40.17, 40.55, 40.89, 41.22, 41.44, 41.73, 41.98];
function sceneSeven(t) { // 24–43.5
  const a = f(t, 24, 24.6) * (1 - f(t, 44, 44.8)); if (a <= 0) return;
  chip("AN-NABA' 12 · AL-MULK 3", a); head('7 LAPIS LANGIT', a, WHITE, 300, 92);
  X.save(); X.globalAlpha = a;
  const base = 1360;
  for (let i = 7; i >= 1; i--) { const ap = f(t, 26 + (7 - i) * .35, 26.6 + (7 - i) * .35); if (ap <= 0) continue;
    const r = 120 + i * 62, on = t >= COUNT[i - 1]; const lit = on ? 1 : 0;
    X.fillStyle = LV[i].c1; X.globalAlpha = a * ap; X.beginPath(); X.arc(CX, base, r * eio(ap), Math.PI, 0); X.fill();
    X.lineWidth = on ? 9 : 4; X.strokeStyle = on ? YEL : 'rgba(255,255,255,.4)'; X.stroke();
    if (ap >= 1) { const ny = base - r + 34; const pop = back(f(t, COUNT[i - 1], COUNT[i - 1] + .3));
      X.save(); X.translate(CX, ny); X.scale(.7 + .3 * (lit ? pop : 1), .7 + .3 * (lit ? pop : 1)); X.globalAlpha = a * (lit ? 1 : .55); txt(String(i), 0, 0, 44, lit ? YEL : WHITE, 'Jakarta'); X.restore(); } }
  X.globalAlpha = a; earth(CX, base - 45, 45); X.fillStyle = NAVY; X.fillRect(0, base, W, 600);
  txt('BUMI', CX, base + 50, 40, SKY, 'Fredoka', 700);
  const top = f(t, 42, 42.8); if (top > 0) { X.globalAlpha = a * top; const g = X.createRadialGradient(CX, base - 600, 10, CX, base - 600, 260); g.addColorStop(0, 'rgba(255,240,190,.9)'); g.addColorStop(1, 'rgba(255,240,190,0)'); X.fillStyle = g; X.fillRect(CX - 300, base - 900, 600, 500);
    txt('ALLAH DI ATAS LANGIT KE-7', CX, base - 760, 46, YEL, 'Fredoka', 700); }
  X.restore();
}
function sceneCompare(t) { // 43.5–54: earth vs first heaven, earth -> ring
  const a = f(t, 44, 44.8) * (1 - f(t, 54, 54.6)); if (a <= 0) return;
  chip('PERUMPAMAAN NABI ﷺ', a); head('BUMI vs LANGIT PERTAMA', a, WHITE, 300, 72);
  X.save(); X.globalAlpha = a * f(t, 46, 47);
  const s = f(t, 50.6, 52);
  X.globalAlpha = a * f(t, 51.2, 52) * (1 - f(t, 54, 54.6)); pill('LANGIT 1', CX, 470, 40, LV[1].c1, WHITE);
  X.restore();
  X.save(); X.globalAlpha = a * f(t, 52.2, 53);
  txt('BUMI : LANGIT 1', CX, 1290, 54, WHITE, 'Fredoka', 700); txt('= CINCIN : PADANG PASIR', CX, 1370, 54, YEL, 'Fredoka', 700);
  X.restore();
}
function sceneStars(t) { // 54–84 inside the first heaven
  const a = f(t, 55, 56) * (1 - f(t, 84, 85)); if (a <= 0) return;
  X.save(); X.globalAlpha = a;
  // stars bloom under the first heaven
  const n = Math.floor(420 * f(t, 58, 62)); X.fillStyle = WHITE;
  for (let k = 0; k < n; k++) { const [sx, sy, s] = STARS[k]; const x = CX + sx * 380, y = 880 + sy * 330 * .62 - 60; if ((x - CX) ** 2 + (y - 900) ** 2 > 400 ** 2) continue; X.globalAlpha = a * (.4 + .6 * s); X.fillRect(x, y, 2 + s * 4, 2 + s * 4); }
  X.globalAlpha = a; chip('FAKTA', a); head('MILIARAN BINTANG', f(t, 60.5, 61.3) * (1 - f(t, 73.3, 74)), WHITE, 300, 84);
  X.globalAlpha = a * f(t, 63, 64) * (1 - f(t, 73.3, 74)); txt('ada yang miliaran kali lebih besar dari bumi', CX, 390, 40, YEL, 'Fredoka', 500);
  // big star vs tiny earth
  const bs = f(t, 64.5, 66) * (1 - f(t, 73.3, 74)); if (bs > 0) { X.globalAlpha = a * bs; const g = X.createRadialGradient(CX + 160, 760, 10, CX + 160, 760, 210); g.addColorStop(0, '#fff5c2'); g.addColorStop(.6, '#ffb534'); g.addColorStop(1, 'rgba(255,120,40,0)'); X.fillStyle = g; X.beginPath(); X.arc(CX + 160, 760, 210, 0, Math.PI * 2); X.fill(); earth(CX - 230, 820, 10); txt('BUMI', CX - 230, 860, 28, SKY, 'Fredoka', 700); txt('BINTANG', CX + 160, 1000, 32, YEL, 'Fredoka', 700); }
  // rocket to Pluto with counter
  const rk = f(t, 74, 78.6), stop = t >= 78.6; const ra = f(t, 73.8, 74.4) * (1 - f(t, 82.6, 83.4));
  if (ra > 0) { X.globalAlpha = a * ra; head('KE PLUTO SAJA…', 1, WHITE, 300, 80);
    const x0 = 230, y0 = 1180, x1 = 860, y1 = 600; earth(x0, y0, 34); X.fillStyle = '#c9b9a6'; X.beginPath(); X.arc(x1, y1, 22, 0, Math.PI * 2); X.fill(); txt('PLUTO', x1, y1 - 50, 32, WHITE, 'Fredoka', 700);
    X.setLineDash([10, 14]); X.strokeStyle = 'rgba(255,255,255,.5)'; X.lineWidth = 4; X.beginPath(); X.moveTo(x0, y0); X.lineTo(x1, y1); X.stroke(); X.setLineDash([]);
    const p = .55 * eio(rk), rx = x0 + (x1 - x0) * p, ry = y0 + (y1 - y0) * p, ang = Math.atan2(y1 - y0, x1 - x0);
    X.save(); X.translate(rx, ry); X.rotate(ang); X.fillStyle = WHITE; rr(-34, -14, 68, 28, 14); X.fill(); X.fillStyle = CORAL; X.beginPath(); X.moveTo(34, -14); X.lineTo(58, 0); X.lineTo(34, 14); X.fill();
    if (!stop) { X.fillStyle = YEL; X.beginPath(); X.moveTo(-34, -9); X.lineTo(-60 - 10 * Math.sin(t * 30), 0); X.lineTo(-34, 9); X.fill(); } X.restore();
    const yrs = Math.round(270 * f(t, 75.2, 76.2)); pill(yrs + ' TAHUN', CX, 1330, 64, YEL, NAVY);
    if (stop) { const s2 = back(f(t, 78.6, 79.1)); X.save(); X.translate(rx, ry - 70); X.scale(s2, s2); txt('✕', 0, 0, 90, CORAL); X.restore(); X.globalAlpha = a * ra * f(t, 79, 79.6); txt('astronot tak akan sampai', CX, 1430, 44, WHITE, 'Fredoka', 700); } }
  X.globalAlpha = a * f(t, 81.5, 82.3); pill('SEMUA MASIH DI BAWAH LANGIT 1', CX, 1240, 40, CORAL, WHITE);
  X.restore();
}
const LBLT = [[84.5, 'LANGIT 2'], [89.1, null]];
function sceneChain(t, z) { // the ladder + labels during the zoom chain (z >= 1)
  const a = f(t, 84, 85) ; if (a <= 0) return;
  const lvl = Math.min(10, Math.round(z)), L = LV[lvl];
  const endA = 1 - f(t, 141.0, 141.5);
