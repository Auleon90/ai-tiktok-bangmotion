<!doctype html>
<html><head><meta charset="utf-8"><title>Kino Montage · portrait kit</title>
<style>html,body{margin:0;background:#141210;overflow:hidden}canvas{display:block}</style>
<script src="props.js"></script></head><body>
<canvas id="c"></canvas>
<script type="module">
// Constructivist Montage (kino-montage) — portrait kit. Look and motion from the Lemo-Opuscar demo (MIT code):
// paper #EDE4D0 with seeded fibre, ink #141210, one red #D52B1E; the -18° constructivist axis; red girder slams in on the beat;
// archive photos (FLUX, graded to hard black-and-white) cut into slanted windows with flicker and flash frames;
// Oswald numbers that slam in digit by digit; Space Mono tags on ink; steep red diagonal wipes between scenes.
import { W, H, SAFE, TAU, clamp, lerp, seg, eo, eio, hash, mulberry, mk, at, SC, IMG, cover, graded, block, text, textWidth, captions, countUp, boot, reg, DUR } from './kit.js';

const RED = '#D52B1E', INK = '#141210', PAPER = '#EDE4D0', TH = -18 * Math.PI / 180, FPS = 30;
const OSW = { family: 'Osw', weight: 700 }, MONO = { family: 'Mono', weight: 700 };
const frameNo = t => Math.floor(t * FPS + 1e-6);
const slam = (t, t0, d = .12) => 1 - eo(seg(t, t0, t0 + d));

let fibre, BW = {};
function prep() {
  fibre = mk(W, H); const f = fibre.getContext('2d'), d = f.createImageData(W, H), r = mulberry(1930);
  for (let i = 0; i < W * H; i++) { const v = 235 + r() * 20 - (r() < .002 ? 60 : 0); d.data[i * 4] = v; d.data[i * 4 + 1] = v * .985; d.data[i * 4 + 2] = v * .96; d.data[i * 4 + 3] = 255; }
  f.putImageData(d, 0, 0);
  for (const k in IMG) BW[k] = graded(IMG[k], 'grayscale(1) contrast(1.45) brightness(.92)', 1080, 1080);
}
function poly(g, pts) { g.beginPath(); pts.forEach(([x, y], i) => i ? g.lineTo(x, y) : g.moveTo(x, y)); g.closePath(); }
function band(g, x, y, L, T_, a, fill) { g.save(); g.translate(x, y); g.rotate(a); g.fillStyle = fill; g.fillRect(-L / 2, -T_ / 2, L, T_); g.restore(); }
function slant(x0, x1, yTop, yBot, a = TH) { const k = Math.tan(a); return [[x0, yTop + k * (x0 - x1)], [x1, yTop], [x1, yBot], [x0, yBot + k * (x0 - x1)]]; }
function flicker(g, t, x, y, w, h, k = .06) { const f = hash(frameNo(t) * 3.1) - .5; g.fillStyle = f > 0 ? `rgba(237,228,208,${f * k})` : `rgba(20,18,16,${-f * k})`; g.fillRect(x, y, w, h); }
function tag(g, id, s, x, y, o = {}) {           // mono label on an ink (or red) block
  const size = o.size || 26, w = textWidth(g, s, size, { ...MONO, ls: .06 }), pad = 9, ax = o.align === 'right' ? x - w : x;
  g.fillStyle = o.bg || INK; g.fillRect(ax - pad, y - size * .82 - pad, w + pad * 2, size + pad * 2);
  text(g, id, s, ax, y, { ...MONO, size, ls: .06, color: o.fill || PAPER, layer: o.layer ?? 0 });
}
// rotated text along the axis, registered by its rotated bounding box
function axisText(g, id, s, x, y, o) {
  g.save(); g.translate(x, y); g.rotate(TH); const w = textWidth(g, s, o.size, o); g.fillStyle = o.color; g.textBaseline = 'alphabetic'; g.fillText(s, -w / 2, o.size * .35); g.restore();
  return w;
}

// the girder: centre on the lower part of the safe area, crossing the frame along the axis
const BAR = { x: 540, y: 1105, T: 118 };
function girder(g, t, s, dir) { BAR.y = BW[s.i] ? 600 : 1105; const o = slam(t, s.t0, .22) * 2400 * dir; band(g, BAR.x - o * Math.cos(TH), BAR.y - o * Math.sin(TH), 2600, BAR.T, TH, RED); band(g, BAR.x + 140, BAR.y + 128, 2600, 26, TH, INK); }

function photoWindow(g, t, s, y0, y1) {
  const im = BW[s.i]; if (!im) return false;
  const o = slam(t, s.t0 + .12, .16) * 1300, ox = o * Math.cos(TH), oy = o * Math.sin(TH);
  // the window fills the top of the frame down to the girder's upper edge (same -18° axis)
  const edge = x => BAR.y + Math.tan(TH) * (x - BAR.x) - BAR.T / 2 / Math.cos(TH) - 14;
  const pts = [[-40, y0], [W + 40, y0], [W + 40, edge(W + 40)], [-40, edge(-40)]].map(([x, y]) => [x + ox, y + oy]); y1 = edge(0);
  g.save(); poly(g, pts); g.clip();
  cover(g, im, ox, y0 - 40 + oy, W, y1 - y0 + 80, 1.04 + (t - s.t0) * .012);
  flicker(g, t, 0, 0, W, H);
  if (t >= s.t0 + .28 && t < s.t0 + .28 + 1.5 / FPS) { g.fillStyle = 'rgba(237,228,208,.5)'; g.fillRect(0, 0, W, H); }
  g.restore();
  return true;
}

// ---------------------------------------------------------------- scene bodies: content box b = {x,y,w,h}
function body(g, t, s, b) {
  const lt = t - s.t0, rv = (d, k = 0) => { const t0 = s.t0 + d + k * .07, o = 900 * slam(t, t0, .12); return { a: t >= t0 ? 1 : 0, dx: -o * Math.cos(TH), dy: -o * Math.sin(TH) }; };
  const type = s.type;
  if (type === 'title' || type === 'tribute') {
    const main = s.title || s.name || '';
    block(g, 'title', main, { x: b.x, y: b.y, w: b.w, h: b.h * .78 }, { ...OSW, size: 220, min: 70, lh: .98, upper: true, color: INK, valign: 'bottom', reveal: k => rv(.35, k) });
    const sub = s.subtitle || s.note; if (sub) block(g, 'sub', sub, { x: b.x, y: b.y + b.h * .8, w: b.w, h: b.h * .2 }, { family: 'Osw', weight: 500, size: 46, min: 28, ls: .08, upper: true, color: RED, reveal: () => ({ a: lt > .7 ? 1 : 0 }) });
  } else if (type === 'counter') {
    const it = s.items || [], n = it.length, rowH = b.h / Math.max(1, n);
    it.forEach((x, k) => {
      const t0 = s.t0 + .3 + k * .5, u = seg(t, t0, t0 + .9), num = `${x.prefix || ''}${countUp(x.value, u)}${x.suffix || ''}`;
      if (t < t0) return; const o = slam(t, t0, .1);
      block(g, 'num' + k, num, { x: b.x - o * 900, y: b.y + k * rowH, w: b.w, h: rowH * .74 }, { ...OSW, size: 300, min: 80, lh: .95, color: k % 2 ? RED : INK, valign: 'bottom' });
      if (x.label) block(g, 'lab' + k, x.label, { x: b.x, y: b.y + k * rowH + rowH * .77, w: b.w, h: rowH * .2 }, { ...MONO, size: 34, min: 22, upper: true, color: INK, alpha: lt > .4 + k * .5 ? 1 : 0, reveal: () => ({ a: t > t0 + .25 ? 1 : 0 }) });
    });
  } else if (type === 'quote' || type === 'headline' || type === 'image' || type === 'list') {
    const main = s.text || s.headline || '', items = s.items || [];
    if (type === 'quote') { g.fillStyle = RED; g.fillRect(b.x, b.y + 8, 14, b.h * .72 * eo(seg(t, s.t0 + .2, s.t0 + .6))); }
    const mx = type === 'quote' ? b.x + 44 : b.x, mw = type === 'quote' ? b.w - 44 : b.w;
    const mainH = items.length ? b.h * .32 : (s.sub || s.source) ? b.h * .76 : b.h;
    block(g, 'main', type === 'quote' ? `“${main}”` : main, { x: mx, y: b.y, w: mw, h: mainH }, { family: 'Osw', weight: type === 'quote' ? 500 : 700, size: type === 'quote' ? 96 : 150, min: 44, lh: 1.02, upper: type !== 'quote', color: INK, valign: items.length ? 'top' : 'middle', reveal: k => rv(.3, k) });
    items.forEach((it, k) => {
      const t0 = s.t0 + .6 + k * .45; if (t < t0) return; const o = slam(t, t0, .1), y = b.y + mainH + 30 + k * ((b.h - mainH - 30) / items.length);
      g.fillStyle = k % 2 ? INK : RED; g.fillRect(b.x - o * 900, y, 86, 86);
      text(g, 'n' + k, String(k + 1), b.x + 43 - o * 900, y + 68, { ...OSW, size: 64, color: PAPER, align: 'center' });
      block(g, 'it' + k, it, { x: b.x + 112 - o * 900, y, w: b.w - 112, h: (b.h - mainH - 30) / items.length - 16 }, { family: 'Osw', weight: 500, size: 54, min: 28, upper: true, color: INK, valign: 'middle' });
    });
    const sub = s.sub || (s.source ? '— ' + s.source : ''); if (sub && !items.length) block(g, 'sub', sub, { x: mx, y: b.y + b.h * .8, w: mw, h: b.h * .2 }, { ...MONO, size: 34, min: 22, upper: true, color: RED, reveal: () => ({ a: lt > .8 ? 1 : 0 }) });
  } else if (type === 'ayat') {
    block(g, 'ar', s.arabic, { x: b.x, y: b.y, w: b.w, h: b.h * .45 }, { family: 'Amiri', weight: 700, size: 92, min: 40, lh: 1.6, color: INK, align: 'center', valign: 'middle', reveal: () => ({ a: eo(seg(t, s.t0 + .2, s.t0 + .8)) }) });
    g.fillStyle = RED; g.fillRect(b.x + b.w / 2 - 60, b.y + b.h * .49, 120 * eo(seg(t, s.t0 + .6, s.t0 + 1)), 10);
    block(g, 'tr', `“${s.translation}”`, { x: b.x, y: b.y + b.h * .55, w: b.w, h: b.h * .32 }, { family: 'Osw', weight: 500, size: 60, min: 30, color: INK, align: 'center', valign: 'middle', reveal: () => ({ a: lt > 1 ? 1 : 0 }) });
    if (s.ref) block(g, 'ref', s.ref, { x: b.x, y: b.y + b.h * .9, w: b.w, h: b.h * .1 }, { ...MONO, size: 30, min: 20, upper: true, color: RED, align: 'center', reveal: () => ({ a: lt > 1.3 ? 1 : 0 }) });
  } else {
    block(g, 'main', s.headline || s.title || s.text || '', b, { ...OSW, size: 140, min: 44, upper: true, color: INK, valign: 'middle' });
  }
}

function sceneFrame(g, t, s) {
  g.drawImage(fibre, 0, 0);
  const hasImg = !!BW[s.i], full = s.type === 'image';
  // constructivist disc behind text scenes without a photo
  { const r = 380 * eo(seg(t, s.t0, s.t0 + .35)); g.fillStyle = RED; g.beginPath(); g.arc(s.i % 2 ? 930 : 150, 1700, r, 0, TAU); g.fill();
    g.save(); g.font = '700 520px Osw'; g.textAlign = s.i % 2 ? 'left' : 'right'; g.lineWidth = 6; g.strokeStyle = INK; g.globalAlpha = .9;
    g.strokeText(String(s.i + 1).padStart(2, '0'), s.i % 2 ? 40 - slam(t, s.t0 + .1, .14) * 600 : W - 40 + slam(t, s.t0 + .1, .14) * 600, 1960); g.restore(); }
    girder(g, t, s, s.i % 2 ? -1 : 1);
  if (hasImg) photoWindow(g, t, s, 0, 0);
  girder(g, t, s, s.i % 2 ? -1 : 1);
  const photoBot = 905;
  // eyebrow rides on the girder, along the axis
  const eb = s.eyebrow || (s.i === 0 ? 'FILM' : ''); if (eb && t > s.t0 + .25) {
    const sz = 42, w = axisText(g, 'eyebrow', eb.toUpperCase(), BAR.x, BAR.y, { family: 'Osw', weight: 700, size: sz, ls: .12, color: PAPER });
    const c = Math.cos(TH), sn = Math.sin(TH), hw = w / 2, hh = sz * .6;
    const xs = [-hw, hw].flatMap(u => [-hh, hh].map(v => BAR.x + u * c - v * sn)), ys = [-hw, hw].flatMap(u => [-hh, hh].map(v => BAR.y + u * sn + v * c));
    reg('eyebrow', eb, { x0: Math.min(...xs), x1: Math.max(...xs), y0: Math.min(...ys), y1: Math.max(...ys) }, { layer: 1 });
  }
  // content box: above the girder; below the photo window when there is one
  const yTop = hasImg ? 930 : SAFE.y0 + 40, yBot = hasImg ? SAFE.y1 : 905;
  if (full) { if (s.headline) block(g, 'main', s.headline, { x: SAFE.x0, y: yTop, w: SAFE.x1 - SAFE.x0, h: yBot - yTop }, { ...OSW, size: 96, min: 40, upper: true, color: INK, valign: 'middle' }); }
  else body(g, t, s, { x: SAFE.x0, y: yTop, w: SAFE.x1 - SAFE.x0, h: yBot - yTop });
  tag(g, 'film', ('FILM · ' + (window.PROPS.title || '')).toUpperCase().slice(0, 34), SAFE.x1, SAFE.y0 + 30, { align: 'right', size: 22, layer: 2 });
  if (hasImg) tag(g, 'src', 'ARSIP · ' + String(s.id).padStart(2, '0'), SAFE.x0 + 6, SAFE.y0 + 60, { size: 20, bg: RED, layer: 3 });
}

function draw(g, t) {
  const { s, prev } = at(t);
  // shake on the slam
  const d = t - s.t0, e = d >= 0 && d < .35 ? Math.exp(-d * 14) * 10 : 0;
  g.save(); g.translate(Math.sin(d * 90) * e, Math.cos(d * 77) * e * .7);
  sceneFrame(g, t, s);
  g.restore();
  // steep red diagonal wipe into the next scene (last .25 s of each scene)
  const nx = SC[s.i + 1]; if (nx && t > nx.t0 - .25) {
    const p = (t - (nx.t0 - .25)) / .25, xc = lerp(-900, W + 900, eio(p)), A = 72 * Math.PI / 180, dx = Math.cos(A) / Math.sin(A) * H / 2;
    g.save(); poly(g, [[xc + dx, 0], [W + 2000, 0], [W + 2000, H], [xc - dx, H]]); g.clip(); g.fillStyle = INK; g.fillRect(0, 0, W, H); g.restore();
    g.save(); g.translate(xc, H / 2); g.rotate(A - Math.PI / 2); g.fillStyle = RED; g.fillRect(-90, -H, 180, H * 2); g.restore();
  }
  // captions: paper on an ink plate, the spoken word in red-orange
  captions(g, t, { family: 'Osw', weight: 700, size: 74, upper: true, color: PAPER, accent: '#FF5B45', pop: true,
    plate: (g, x0, y0, x1, y1, a) => { g.fillStyle = INK; g.globalAlpha = .92 * a; g.fillRect(x0, y0, x1 - x0, y1 - y0); g.fillStyle = RED; g.fillRect(x0, y0, 12, y1 - y0); g.globalAlpha = 1; } });
  // film grain over everything
  const r = mulberry(frameNo(t) + 7); g.fillStyle = 'rgba(20,18,16,.05)'; for (let i = 0; i < 220; i++) g.fillRect(r() * W, r() * H, 2, 2);
}

await boot({ fonts: [['Osw', 'fonts/lemo/oswald-700.woff2', '700'], ['Osw', 'fonts/lemo/oswald-500.woff2', '500'], ['Mono', 'fonts/lemo/spacemono-700.woff2', '700'],
  ['Amiri', 'fonts/amiri-arabic-700-normal.woff2', '700']], draw: (g, t) => { if (!fibre) prep(); draw(g, t); } });
</script></body></html>
