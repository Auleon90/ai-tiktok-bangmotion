<!doctype html>
<html><head><meta charset="utf-8"><title>Gilded Illumination · portrait kit</title>
<style>html,body{margin:0;background:#efe2c4;overflow:hidden}canvas{display:block}</style>
<script src="props.js"></script></head><body>
<canvas id="c"></canvas>
<script type="module">
// Gilded Illumination — portrait kit. Look and motion from the Lemo-Opuscar demo (MIT code): vellum #efe2c4, iron-gall ink,
// lapis/ultramarine ground with punched gold stars, a gold sun with wavy rays, verdigris and lilac spire rocks, vermilion and azure bands,
// burnished gold that catches a moving glint, the subtitle written on a banderole (scroll ribbon) that unrolls.
// Portrait adaptation: the miniature sits in a pointed-arch window (no figures: suitable for Qur'an/hadith and sirah), text below on vellum.
import { W, H, SAFE, TAU, clamp, lerp, seg, eo, ss, back, mulberry, mk, at, SC, IMG, cover, graded, block, captions, capAt, stdBody, boot, reg, font, fit } from './kit.js';

const VELL = '#efe2c4', INK = '#2a1a10', GALL = '#3b2416', LAPIS = '#1f3f9a', LAPIS_D = '#132a6e', ULTRA_D = '#141f66', VERM = '#c8321f', AZUR = '#3d7fa6',
  OCHRE = '#d39a45', OCHRE_D = '#9a6424', OCHRE_L = '#e8bd72', VERDI = '#3f8f7a', VERDI_D = '#25604f', LILAC = '#a596c4', LILAC_D = '#6c5d92', VERD = '#2f6b3a', VERD_L = '#5f9a52', ROSE = '#d97a8a';
const TH = {
  align: 'center', rise: 18, accent: VERM,
  title: { family: 'Fell', weight: 400, size: 100, min: 44, lh: 1.08, color: INK },
  quote: { family: 'Fell', weight: 400, italic: true, size: 70, min: 36, lh: 1.2, color: INK },
  num: { family: 'Fell', weight: 400, size: 190, min: 64, lh: 1, color: VERM },
  body: { family: 'Fell', weight: 400, italic: true, size: 50, min: 28, lh: 1.25, color: GALL },
  label: { family: 'Fell', weight: 400, size: 36, min: 22, ls: .16, upper: true, color: OCHRE_D },
  arabic: { family: 'Amiri', weight: 700, color: INK },
  rule: (g, x, y, w, a) => { const cx = x + w / 2; g.globalAlpha = a; g.fillStyle = VERM; g.fillRect(cx - 150 * a, y - 1, 300 * a, 3); for (const d of [-1, 0, 1]) { g.save(); g.translate(cx + d * 170 * a, y); g.rotate(Math.PI / 4); g.fillStyle = d ? AZUR : OCHRE; g.fillRect(-8, -8, 16, 16); g.restore(); } g.globalAlpha = 1; },
  bullet: (g, k, x, y, s, a) => { g.save(); g.translate(x + s / 2, y + s / 2); g.scale(a, a); star(g, 0, 0, s * .42, 8, k % 2 ? AZUR : VERM); g.restore(); },
};
let SPK, STARS, WARM = {};
function prep() {
  SPK = mk(256, 256); const x = SPK.getContext('2d'), r = mulberry(5);
  for (let i = 0; i < 2600; i++) { x.fillStyle = r() < .5 ? 'rgba(90,60,30,.08)' : 'rgba(255,255,240,.18)'; x.fillRect(r() * 256, r() * 256, 1 + r() * 2, 1 + r() * 2); }
  const rr = mulberry(77); STARS = [...Array(46)].map(() => ({ x: rr(), y: rr() * .62, s: 8 + rr() * 16, ph: rr() * TAU }));
  for (const k in IMG) WARM[k] = graded(IMG[k], 'sepia(.35) saturate(1.25) contrast(1.08)', 1080, 1080);
}
function gold(g, x0, y0, x1, y1, t) {   // burnished leaf: ochre ramp + a glint that travels along the diagonal
  const gr = g.createLinearGradient(x0, y0, x1, y1), k = (t * .18) % 1.6 - .3;
  gr.addColorStop(0, OCHRE_D); gr.addColorStop(clamp(k - .12), OCHRE); gr.addColorStop(clamp(k), '#fff2c2'); gr.addColorStop(clamp(k + .12), OCHRE_L); gr.addColorStop(1, OCHRE_D); return gr;
}
function star(g, x, y, R, n, col, rot = 0) { g.beginPath(); for (let i = 0; i < n * 2; i++) { const a = rot + i * Math.PI / n, r = i % 2 ? R * .45 : R; g.lineTo(x + Math.cos(a) * r, y + Math.sin(a) * r); } g.closePath(); g.fillStyle = col; g.fill(); g.strokeStyle = INK; g.lineWidth = 1.6; g.stroke(); }
// pointed (Islamic) arch window
function arch(g, x, y, w, h) { const r = w * .62; g.beginPath(); g.moveTo(x, y + h); g.lineTo(x, y + w * .5); g.arc(x + r, y + w * .5, r, Math.PI, Math.PI * 1.32); g.lineTo(x + w / 2, y); const p = Math.PI * 1.68; g.arc(x + w - r, y + w * .5, r, p, 0); g.lineTo(x + w, y + h); g.closePath(); }
function spire(g, bx, by, w, h, col, rim) { g.beginPath(); g.moveTo(bx - w / 2, by); g.bezierCurveTo(bx - w * .35, by - h * .5, bx - w * .25, by - h * .85, bx - w * .1, by - h); g.lineTo(bx + w * .12, by - h * .96); g.bezierCurveTo(bx + w * .3, by - h * .7, bx + w * .4, by - h * .4, bx + w / 2, by); g.closePath(); g.fillStyle = col; g.fill(); g.strokeStyle = INK; g.lineWidth = 2.4; g.stroke(); g.save(); g.clip(); g.fillStyle = rim; g.globalAlpha = .55; g.fillRect(bx + w * .12, by - h, w, h); g.restore(); }
function miniature(g, t, s, P) {     // lapis sky, gold sun, stars, rocks and meadow, all inside the arch
  const lt = t - s.t0;
  const sky = g.createLinearGradient(0, P.y, 0, P.y + P.h); sky.addColorStop(0, ULTRA_D); sky.addColorStop(1, LAPIS); g.fillStyle = sky; g.fillRect(P.x, P.y, P.w, P.h);
  for (const st of STARS) { const tw = .75 + .25 * Math.sin(t * 2 + st.ph); star(g, P.x + st.x * P.w, P.y + st.y * P.h, st.s * tw, 4, gold(g, P.x, P.y, P.x + P.w, P.y + P.h, t), st.ph); }
  if (s.type === 'ayat') return;
  const sx = P.x + P.w * .7, sy = P.y + P.h * .3, sr = P.w * .12 * back(seg(lt, .1, .7), 1.4);
  g.save(); g.translate(sx, sy); g.rotate(t * .08); for (let k = 0; k < 16; k++) { g.rotate(TAU / 16); g.beginPath(); g.moveTo(sr * .9, -8); for (let u = 0; u <= 1; u += .1) g.lineTo(sr * (1 + u * .9), Math.sin(u * 9) * 7 * (1 - u)); g.lineTo(sr * .9, 8); g.closePath(); g.fillStyle = gold(g, -sr * 2, -sr * 2, sr * 2, sr * 2, t); g.fill(); g.strokeStyle = INK; g.lineWidth = 1.4; g.stroke(); } g.restore();
  g.beginPath(); g.arc(sx, sy, sr, 0, TAU); g.fillStyle = gold(g, sx - sr, sy - sr, sx + sr, sy + sr, t); g.fill(); g.strokeStyle = INK; g.lineWidth = 2.4; g.stroke();
  const by = P.y + P.h, rise = (1 - eo(seg(lt, 0, .6))) * 60;
  spire(g, P.x + P.w * .14, by + rise, P.w * .2, P.h * .5, LILAC, LILAC_D); spire(g, P.x + P.w * .3, by + rise, P.w * .14, P.h * .34, VERDI, VERDI_D);
  spire(g, P.x + P.w * .86, by + rise, P.w * .22, P.h * .42, ROSE, LILAC_D); spire(g, P.x + P.w * .7, by + rise, P.w * .12, P.h * .26, VERDI, VERDI_D);
  g.beginPath(); g.moveTo(P.x, by); for (let x = 0; x <= 1.0001; x += .05) g.lineTo(P.x + x * P.w, by - P.h * .12 - Math.sin(x * 7) * 14 + rise); g.lineTo(P.x + P.w, by); g.closePath(); g.fillStyle = VERD; g.fill(); g.strokeStyle = INK; g.lineWidth = 2.4; g.stroke();
  const r = mulberry(s.i + 3); for (let k = 0; k < 18; k++) { const fx = P.x + r() * P.w, fy = by - r() * P.h * .1 + rise; g.fillStyle = r() < .5 ? VERM : '#f2e6c9'; g.beginPath(); g.arc(fx, fy, 4, 0, TAU); g.fill(); }
  g.fillStyle = VERD_L; g.globalAlpha = .4; g.fillRect(P.x, by - 10 + rise, P.w, 10); g.globalAlpha = 1;
}
function border(g, t) {
  const m = 26, b = 40;
  g.fillStyle = gold(g, 0, 0, W, H, t); g.fillRect(m, m, W - 2 * m, b); g.fillRect(m, H - m - b, W - 2 * m, b); g.fillRect(m, m, b, H - 2 * m); g.fillRect(W - m - b, m, b, H - 2 * m);
  // vermilion / azure chequer inside the gold
  const q = 20; for (let x = m + b; x < W - m - b; x += q) for (const y of [m + b, H - m - b - q]) { g.fillStyle = ((x - m) / q | 0) % 2 ? VERM : AZUR; g.fillRect(x, y, q, q); }
  for (let y = m + b; y < H - m - b; y += q) for (const x of [m + b, W - m - b - q]) { g.fillStyle = ((y - m) / q | 0) % 2 ? AZUR : VERM; g.fillRect(x, y, q, q); }
  g.strokeStyle = INK; g.lineWidth = 3; g.strokeRect(m, m, W - 2 * m, H - 2 * m); g.strokeRect(m + b + q, m + b + q, W - 2 * (m + b + q), H - 2 * (m + b + q));
  for (const [x, y] of [[m + b / 2, m + b / 2], [W - m - b / 2, m + b / 2], [m + b / 2, H - m - b / 2], [W - m - b / 2, H - m - b / 2]]) star(g, x, y, 26, 8, VERM, t * .2);
}
function banderole(g, t) {      // captions on an unrolling scroll ribbon
  const c = capAt(t); if (!c) return;
  const open = eo(clamp(c.lt / .35)), cy = 1440, h = 120;
  const o = { family: 'Fell', italic: true, weight: 400, color: '#4a2c16' }, f = fit(g, c.words.join(' '), 760, h - 24, { ...o, size: 66, min: 36, maxLines: 1 });
  font(g, f.size, o); const hw = (Math.max(260, f.widths[0]) / 2 + 60) * open, cx = W / 2;
  for (const sd of [-1, 1]) { const ex = cx + sd * hw; g.beginPath(); g.moveTo(ex - sd * 6, cy - h / 2 + 22); g.lineTo(ex + sd * 62, cy - h / 2 + 34); g.lineTo(ex + sd * 38, cy + 4); g.lineTo(ex + sd * 70, cy + h / 2 + 22); g.lineTo(ex - sd * 6, cy + h / 2 - 6); g.closePath();
    g.fillStyle = '#d8c69c'; g.fill(); g.strokeStyle = INK; g.lineWidth = 3; g.lineJoin = 'round'; g.stroke(); }
  g.beginPath(); g.moveTo(cx - hw, cy - h / 2); g.bezierCurveTo(cx - hw * .4, cy - h / 2 - 10, cx + hw * .4, cy - h / 2 + 9, cx + hw, cy - h / 2); g.lineTo(cx + hw, cy + h / 2); g.bezierCurveTo(cx + hw * .4, cy + h / 2 + 9, cx - hw * .4, cy + h / 2 - 10, cx - hw, cy + h / 2); g.closePath();
  g.fillStyle = VELL; g.fill(); g.strokeStyle = INK; g.lineWidth = 3; g.stroke();
  g.save(); g.clip(); const wsp = g.measureText(' ').width; let x = cx - f.widths[0] / 2;
  c.words.forEach((w, k) => { const ww = g.measureText(w).width; if (k <= c.active) { g.fillStyle = k === c.active ? VERM : '#4a2c16'; g.fillText(w, x, cy + f.size * .32); } x += ww + wsp; }); g.restore();
  reg('caption', c.words.join(' '), { x0: cx - f.widths[0] / 2, y0: cy - f.size * .6, x1: cx + f.widths[0] / 2, y1: cy + f.size * .45 }, { cap: true, layer: 9 });
}

function draw(g, t) {
  const { s } = at(t), lt = t - s.t0, img = WARM[s.i];
  g.fillStyle = VELL; g.fillRect(0, 0, W, H); g.fillStyle = g.createPattern(SPK, 'repeat'); g.fillRect(0, 0, W, H);
  border(g, t);
  // the arch window: the miniature, or the photo (warmed, like a painted panel), or — for ayat — the verse in gold on lapis
  const P = { x: 170, y: 225, w: 740, h: s.type === 'ayat' ? 540 : 500 }, ap = eo(seg(lt, 0, .5));
  g.save(); arch(g, P.x, P.y, P.w, P.h); g.clip(); g.globalAlpha = ap;
  if (img && s.type !== 'ayat') cover(g, img, P.x, P.y, P.w, P.h, 1.04 + lt * .01); else miniature(g, t, s, P);
  g.restore();
  g.save(); arch(g, P.x, P.y, P.w, P.h); g.lineWidth = 16; g.strokeStyle = gold(g, P.x, P.y, P.x + P.w, P.y + P.h, t); g.stroke(); g.lineWidth = 3; g.strokeStyle = INK; g.stroke(); g.restore();
  reg('arch', '[miniature]', { x0: P.x - 8, y0: P.y - 8, x1: P.x + P.w + 8, y1: P.y + P.h + 8 });
  if (s.type === 'ayat') {
    block(g, 'ar', s.arabic, { x: P.x + 60, y: P.y + 200, w: P.w - 120, h: P.h - 260 }, { family: 'Amiri', weight: 700, size: 104, min: 44, lh: 1.6, align: 'center', valign: 'middle', layer: 1,
      stroke: INK, strokeW: 5, paint: (g, ln, x, y) => { g.fillStyle = gold(g, x, y - 80, x + 600, y + 20, t); g.fillText(ln, x, y); }, reveal: () => ({ a: eo(seg(lt, .2, 1)) }) });
    stdBody(g, t, { ...s, type: 'quote', text: s.translation, source: s.ref }, { x: SAFE.x0 + 30, y: P.y + P.h + 40, w: SAFE.x1 - SAFE.x0 - 60, h: SAFE.y1 - P.y - P.h - 40 }, TH);
  } else {
    const s2 = s.type === 'image' ? { ...s, type: 'headline' } : s;
    if (s.eyebrow) block(g, 'eyebrow', s.eyebrow, { x: SAFE.x0, y: P.y + P.h + 26, w: SAFE.x1 - SAFE.x0, h: 44 }, { ...TH.label, align: 'center', reveal: () => ({ a: eo(seg(lt, .2, .6)) }) });
    stdBody(g, t, s2, { x: SAFE.x0 + 30, y: P.y + P.h + 84, w: SAFE.x1 - SAFE.x0 - 60, h: SAFE.y1 - P.y - P.h - 84 }, img ? { ...TH, title: { ...TH.title, size: 84 }, num: { ...TH.num, size: 130 }, quote: { ...TH.quote, size: 58 } } : { ...TH, title: { ...TH.title, size: 120 }, body: { ...TH.body, size: 56 } });
  }
  // a gilded medallion under the scroll: eight-point star, vermilion and azure rings (decor, below the safe area)
  { const cx = W / 2, cy = 1730, u = back(seg(lt, .1, .6), 1.4), R = 120 * u;
    g.strokeStyle = OCHRE_D; g.lineWidth = 3; for (const d of [-1, 1]) { g.beginPath(); g.moveTo(cx + d * 150, cy); g.bezierCurveTo(cx + d * 260, cy - 70, cx + d * 330, cy + 60, cx + d * 420, cy); g.stroke(); }
    g.beginPath(); g.arc(cx, cy, R * 1.08, 0, TAU); g.fillStyle = AZUR; g.fill(); g.strokeStyle = INK; g.stroke();
    star(g, cx, cy, R, 8, gold(g, cx - R, cy - R, cx + R, cy + R, t), t * .1); g.beginPath(); g.arc(cx, cy, R * .3, 0, TAU); g.fillStyle = VERM; g.fill(); g.stroke(); }
  banderole(g, t);
}
await boot({ fonts: [['Fell', 'fonts/lemo/imfell-400.woff2'], ['Fell', 'fonts/lemo/imfell-400i.woff2', '400', 'italic'], ['Amiri', 'fonts/amiri-arabic-700-normal.woff2', '700']],
  draw: (g, t) => { if (!SPK) prep(); draw(g, t); } });
</script></body></html>
