<!doctype html>
<html><head><meta charset="utf-8"><title>Tilt-shift Miniature · portrait kit</title>
<style>html,body{margin:0;background:#202329;overflow:hidden}canvas{display:block}</style>
<script src="props.js"></script></head><body>
<canvas id="c"></canvas>
<script type="module">
// Tilt-Shift Miniature — portrait kit, hybrid. The town, light, blur band and grade are the Lemo-Opuscar demo's own three.js engine
// (engine/, MIT), pre-rendered as two stills per scene (prerender.mjs: same camera, the town's clock advanced = the time-lapse step).
// Here, in 2D: the camera keeps moving smoothly on every frame while the world holds and then jumps (time-lapse), the time-lapse clock
// with its speed readout, text as the place's own signage (a road sign, a platform board, a notice), subtitles on a sign panel in the
// lower blur band. Keep text short: the place carries the story.
import { W, H, SAFE, TAU, clamp, lerp, seg, eo, ss, back, at, SC, block, text, capAt, fit, font, stdBody, boot, reg, KIT, countUp } from './kit.js';
import { clashModel, drawFigure, drawFx, clashText } from './clash.js';

const ST = {}; const load = src => new Promise(r => { const i = new Image(); i.onload = () => r(i); i.onerror = () => r(null); i.src = src; });
KIT.look = { fill: f => f.color || (f.side > 0 ? '#3f7fbf' : '#d8412f'), stroke: 'rgba(0,0,0,.35)', lw: 1.5, shield: '#f2c230', weapon: '#22252b', glow: '#ffe7a0', glowMode: 'lighter' };
const TH = {
  align: 'center', rise: 10, accent: '#f2c230',
  title: { family: 'Overpass', weight: 800, size: 92, min: 40, lh: 1.02, color: '#ffffff' },
  quote: { family: 'Overpass', weight: 700, size: 56, min: 30, lh: 1.2, color: '#1d2a22' },
  num: { family: 'OMono', weight: 600, size: 150, min: 56, lh: 1, color: '#ffb42a' },
  body: { family: 'Overpass', weight: 700, size: 44, min: 26, lh: 1.2, color: '#e9f2ec' },
  label: { family: 'OMono', weight: 600, size: 30, min: 20, ls: .12, upper: true, color: '#ffd76a' },
  side: { family: 'Overpass', weight: 800, size: 40, min: 24, upper: true, fixed: true, color: '#ffffff' },
  arabic: { family: 'Amiri', weight: 700, color: '#ffffff' },
};
// a road sign: green panel, white inset border, rounded corners (the graphic language of the place's signs)
function roadSign(g, x, y, w, h, u, fill = '#1f6b4a', edge = '#ffffff') {
  if (u <= 0) return; const s = back(u, 1.6); g.save(); g.translate(x + w / 2, y + h / 2); g.scale(s, s); g.translate(-x - w / 2, -y - h / 2);
  g.shadowColor = 'rgba(0,0,0,.35)'; g.shadowBlur = 18; g.shadowOffsetY = 8; g.fillStyle = fill; g.beginPath(); g.roundRect(x, y, w, h, 22); g.fill(); g.shadowBlur = 0;
  g.strokeStyle = edge; g.lineWidth = 5; g.beginPath(); g.roundRect(x + 12, y + 12, w - 24, h - 24, 14); g.stroke(); g.restore();
}
function board(g, x, y, w, h, u) {   // a platform board: black, amber digits
  if (u <= 0) return; g.save(); g.globalAlpha = Math.min(1, u * 2); g.fillStyle = '#121418'; g.beginPath(); g.roundRect(x, y, w, h, 14); g.fill(); g.strokeStyle = '#3a3f48'; g.lineWidth = 4; g.stroke(); g.restore();
}
function clock(g, t, s) {   // the time-lapse clock: the audience's speedometer
  const mins = 6 * 60 + 30 + Math.floor(t * 24 / 60 * 6) % (14 * 60), hh = String(Math.floor(mins / 60)).padStart(2, '0'), mm = String(mins % 60).padStart(2, '0');
  const x = SAFE.x0, y = SAFE.y0, w = 300, h = 112; g.save(); g.fillStyle = 'rgba(18,20,24,.72)'; g.beginPath(); g.roundRect(x, y, w, h, 16); g.fill(); g.strokeStyle = 'rgba(255,255,255,.35)'; g.lineWidth = 2; g.stroke(); g.restore();
  text(g, 'clock', `${hh}:${mm}`, x + 22, y + 62, { family: 'Overpass', weight: 800, size: 54, color: '#f7f4ee', layer: 7 });
  text(g, 'rate', '×24 TIME-LAPSE', x + 22, y + 96, { family: 'OMono', weight: 600, size: 22, color: '#ffc83a', layer: 7 });
}
function draw(g, t) {
  const { s } = at(t), lt = t - s.t0, A = ST['a' + s.i], B = ST['b' + s.i];
  // the world holds, then jumps forward (time-lapse); the camera glides on every frame
  const im = lt < s.d * .5 ? A : (B || A), z = lerp(1.0, 1.08, ss(seg(lt, 0, s.d))), dy = lerp(0, -50, ss(seg(lt, 0, s.d)));
  g.fillStyle = '#202329'; g.fillRect(0, 0, W, H);
  if (im) { g.save(); g.translate(W / 2, H / 2 + dy); g.scale(z, z); g.drawImage(im, -W / 2, -H / 2, W, H); g.restore(); }
  if (s.i > 0 && lt < .12) { g.fillStyle = `rgba(255,255,255,${.25 * (1 - lt / .12)})`; g.fillRect(0, 0, W, H); }   // a cut on the beat
  clock(g, t, s);
  const u = seg(lt, .2, .6), T = s.type, X = SAFE.x0, Wd = SAFE.x1 - SAFE.x0, top = SAFE.y0 + 150;
  if (s.eyebrow) { roadSign(g, SAFE.x1 - 380, SAFE.y0 + 10, 380, 92, u, '#1d4f8a'); block(g, 'eyebrow', s.eyebrow, { x: SAFE.x1 - 350, y: SAFE.y0 + 34, w: 320, h: 44 }, { ...TH.label, color: '#ffffff', align: 'center' }); }
  if (T === 'custom') { stdBody(g, t, s, { x: X, y: top, w: Wd, h: SAFE.y1 - top }, TH); }
  else if (T === 'counter') {   // platform boards with amber digits
    const it = s.items || [], rowH = Math.min(300, 600 / Math.max(1, it.length));
    it.forEach((x, k) => { const y = top + k * (rowH + 20), uu = seg(lt, .3 + k * .4, .7 + k * .4); board(g, X, y, Wd, rowH, uu); if (uu <= 0) return;
      block(g, 'num' + k, `${x.prefix || ''}${countUp(x.value, seg(lt, .4 + k * .4, 1.4 + k * .4))}${x.suffix || ''}`, { x: X + 30, y: y + 14, w: Wd - 60, h: rowH * .66 }, { ...TH.num, align: 'center', valign: 'middle' });
      if (x.label) block(g, 'lab' + k, x.label, { x: X + 30, y: y + rowH * .72, w: Wd - 60, h: rowH * .22 }, { ...TH.label, align: 'center' }); });
  } else if (T === 'quote') {   // a notice pinned in the world: cream board
    roadSign(g, X, top, Wd, 520, u, '#f3efe4', '#1d2a22'); if (u > .5) stdBody(g, t, s, { x: X + 50, y: top + 50, w: Wd - 100, h: 420 }, { ...TH, quote: { ...TH.quote }, label: { ...TH.label, color: '#1d4f8a' } });
  } else if (T === 'clash') {
    roadSign(g, X, top, Wd, 320, u); if (u > .5) clashText(g, t, s, { x: X + 40, y: top + 30, w: Wd - 80, h: 190 }, TH, top + 240);
    const m = clashModel(s, t, { x0: SAFE.x0, x1: SAFE.x1, ground: 1120, S: 120 }); for (const f of m.figs) drawFigure(g, f, t, KIT.look); drawFx(g, m.fx, { dust: '#c9ccd0', arrow: '#111', spark: '#f2c230' });
  } else {   // titles, headlines, lists, ayat: a big green road sign in the upper blur band
    const h = { title: 360, tribute: 360, headline: 380, list: 620, ayat: 640, image: 300 }[T] || 400;
    roadSign(g, X, top, Wd, h, u); if (u > .5) stdBody(g, t, T === 'image' ? { ...s, type: 'headline' } : s, { x: X + 50, y: top + 40, w: Wd - 100, h: h - 80 }, TH);
  }
  subs(g, t);
}
function subs(g, t) {   // subtitles on a sign panel in the lower blur band, with a traffic-light icon
  const c = capAt(t); if (!c) return; const o = { family: 'Overpass', weight: 700 }, full = c.words.join(' '), shown = c.words.slice(0, c.active + 1).join(' ');
  const f = fit(g, full, 720, 150, { ...o, size: 54, min: 32, maxLines: 2 }); font(g, f.size, o); const w = Math.max(...f.widths) + 150, h = f.h + 40, x = (W - w) / 2, y = 1360;
  g.save(); g.fillStyle = 'rgba(16,44,40,.86)'; g.beginPath(); g.roundRect(x, y, w, h, 16); g.fill(); g.strokeStyle = 'rgba(190,230,210,.55)'; g.lineWidth = 3; g.stroke();
  g.fillStyle = '#1a1c20'; g.beginPath(); g.roundRect(x + 26, y + h / 2 - 42, 40, 84, 10); g.fill(); [['#d8412f', -24], ['#f2c230', 0], ['#4fd27a', 24]].forEach(([col, dy], k) => { g.fillStyle = k === 2 ? col : 'rgba(255,255,255,.12)'; g.beginPath(); g.arc(x + 46, y + h / 2 + dy, 9, 0, TAU); g.fill(); });
  g.restore();
  block(g, 'caption', shown, { x: x + 96, y: y + 20, w: w - 120, h: h - 40 }, { ...o, size: f.size, min: f.size, color: '#f2f6f2', cap: true, layer: 9, valign: 'middle' });
}
await Promise.all(SC.map(async s => { ST['a' + s.i] = await load(`ts/a_${s.i}.jpg`); ST['b' + s.i] = await load(`ts/b_${s.i}.jpg`); }));   // pre-rendered by prerender.mjs
await boot({ fonts: [['Overpass', 'fonts/lemo/overpass-800.woff2', '800'], ['Overpass', 'fonts/lemo/overpass-700.woff2', '700'], ['OMono', 'fonts/lemo/overpassmono-600.woff2', '600'], ['Amiri', 'fonts/amiri-arabic-700-normal.woff2', '700']], draw });
</script>
</body></html>
